<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SubTrack Pro</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body{display:grid;place-items:center;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,rgba(79,142,247,.18),transparent 45%),var(--bg);padding:20px}
    .login-card{width:min(100%,420px);background:var(--surf);border:1px solid var(--b2);border-radius:20px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--pur));font-size:22px}
    h1{font-size:23px;letter-spacing:-.6px;margin:0 0 4px}.sub{color:var(--tx2);font-size:13px;margin-bottom:24px}
    .login-fields{display:grid;gap:16px}.login-fields input{width:100%;height:44px;background:var(--panel);border:1px solid var(--b2);border-radius:9px;padding:0 12px;color:var(--tx);font:inherit;outline:none}.login-fields input:focus{border-color:var(--acc)}
    .login-btn{width:100%;height:44px;margin-top:6px}.login-error{min-height:18px;color:var(--red);font-size:12px}.login-foot{font-size:11px;color:var(--tx3);margin-top:20px;text-align:center}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-brand"><div class="login-mark">📡</div><div><strong>SubTrack Pro</strong><div class="brand-ver">PRIVATE WORKSPACE</div></div></div>
    <h1>Welcome back</h1><div class="sub">Sign in to manage invoices, subscriptions and automations.</div>
    <form id="loginForm" class="login-fields">
      <div class="fg"><label class="flabel" for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@company.com"></div>
      <div class="fg"><label class="flabel" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div>
      <div class="login-error" id="error"></div><button class="btn btn-primary login-btn" type="submit">Sign in</button>
    </form>
    <div class="login-foot">Single administrator access · credentials are set in the server .env file.</div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
